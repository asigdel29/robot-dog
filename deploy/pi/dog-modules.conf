# dog-modules.conf: kernel modules that register the device numbers of the dog hardware at boot.
# Install it as /etc/modules-load.d/dog.conf. DeviceAllow=char-ttyUSB (and the others) in the units resolves
# a device major from /proc/devices when a unit starts, so the driver must be loaded before the device
# is connected. Without this file, a Feather or camera that is connected after boot stays blocked.
usbserial
cdc_acm
videodev
snd
