# dog-tmpfiles.conf: creates the dog runtime and state directories; install as /etc/tmpfiles.d/dog.conf.
# /run/dog holds the daemon sockets; each daemon sets the group of its own sockets (dog or doglink).
# /var/lib/dog/captures is group dog with setgid, so robotctl run by the admin user can write captures.
d /run/dog 0755 dog dog -
d /var/lib/dog 0750 dog dog -
d /var/lib/dog/captures 2770 dog dog -
