# CI gate: unit, conformance (fake bridge) and end-to-end tests of the dog stack, and the firmware build.
name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor; 3.13 is the Python of Raspberry Pi OS (Debian 13 Trixie) on the Pi.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test packages
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, conformance and end-to-end tests
        run: python -m unittest discover -v -s tests
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      ARDUINO_CLI: "1.5.1"
      ESP32_CORE: esp32:esp32@3.3.12
      IRREMOTE: IRremote@4.7.1
      ARDUINOJSON: ArduinoJson@7.4.3
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI }}
      - name: Cache the esp32 core and the libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-cli${{ env.ARDUINO_CLI }}-${{ env.ESP32_CORE }}-${{ env.IRREMOTE }}-${{ env.ARDUINOJSON }}
      - name: Install the esp32 core and the libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "$IRREMOTE" "$ARDUINOJSON"
      - name: Compile the IR bridge; any compiler warning fails the job
        shell: bash
        run: |
          arduino-cli compile --fqbn esp32:esp32:adafruit_feather_esp32_v2 --warnings all firmware/ir_bridge 2>&1 | tee build.log
          if grep -n "warning:" build.log; then exit 1; fi
  deploy:
    # Checks of the deploy files: shell scripts, systemd units, tmpfiles, the Caddyfile and a real Pi install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck the scripts, hooks and launcher
        run: shellcheck scripts/*.sh hooks/preinstall hooks/postinstall deploy/pi/robotctl
      - name: Create the users and venv paths that the units name
        run: |
          sudo groupadd --system dog
          sudo groupadd --system doglink
          sudo useradd --system --gid dog --no-create-home dog
          sudo useradd --system --gid doglink --no-create-home doglink
          sudo useradd --system --user-group --no-create-home doghub
          for venv in /opt/dog/current/.venv /opt/doghub/.venv; do
            sudo mkdir -p "$venv/bin"
            sudo ln -s /usr/bin/python3 "$venv/bin/python"
          done
      - name: Verify the systemd units
        # verify only warns about an unknown key, so a warning that names one of these units also fails the step.
        run: |
          systemd-analyze verify deploy/pi/dog.target deploy/pi/*.service deploy/hub/doghub.service 2>&1 | tee verify.log
          if grep -E 'dog\.target|(robotd|mediad|padd|linkd|doghub)\.service' verify.log; then exit 1; fi
      - name: Create the dog directories from the tmpfiles entry
        run: |
          sudo systemd-tmpfiles --create "$PWD/deploy/pi/dog-tmpfiles.conf"
          sudo stat -c '%U:%G %a %n' /run/dog /var/lib/dog /var/lib/dog/captures
      - name: Validate the Caddyfile with the Ubuntu caddy package (the droplet version)
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy
          DOG_DOMAIN=example.com caddy validate --adapter caddyfile --config deploy/hub/Caddyfile
      - name: Install the real release in Debian 13 and check the commit and the rollback
        # Real hooks, robotctl and robotd; shims for systemctl and systemd-run (scripts/check-pi-install.sh).
        run: |
          tarball=$(scripts/package.sh)
          docker run --rm -v "$PWD":/repo:ro -w /repo debian:trixie bash scripts/check-pi-install.sh "$tarball"
